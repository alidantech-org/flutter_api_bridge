name: flutter_api_bridge
description: A typed Flutter HTTP runtime with named connections, explicit authentication lifecycle, safe structured logging, cookies, caching, and uploads.
version: 0.2.0-alpha.1
repository: https://github.com/alidantech-org/flutter_api_bridge
issue_tracker: https://github.com/alidantech-org/flutter_api_bridge/issues

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  lints: ^5.0.0