name: flutter_api_bridge
description: Production transport runtime for generated Dart and Flutter API clients with persistent cookies, secure auth, retries, logging, and session-scoped Hive caching.
version: 0.2.0
repository: https://github.com/alidantech-org/flutter_api_bridge
issue_tracker: https://github.com/alidantech-org/flutter_api_bridge/issues

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.1
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  lints: ^5.0.0
