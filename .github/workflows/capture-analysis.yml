name: Capture analyzer diagnostics

on:
  push:
    branches:
      - chatgpt/auth-logging

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/auth-logging

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub > ANALYZE_OUTPUT.txt 2>&1
          status=$?
          echo >> ANALYZE_OUTPUT.txt
          echo "ANALYZE_EXIT_CODE=$status" >> ANALYZE_OUTPUT.txt
          exit 0

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ANALYZE_OUTPUT.txt
          git commit -m "chore: capture analyzer diagnostics"
          git push origin HEAD:chatgpt/auth-logging
