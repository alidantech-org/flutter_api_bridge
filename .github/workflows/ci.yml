name: Flutter package CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify root formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze package
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      - name: Resolve generated package fixture
        working-directory: tool/generated_runtime_fixture
        run: flutter pub get

      - name: Format generated package fixture
        working-directory: tool/generated_runtime_fixture
        run: dart format lib test

      - name: Commit generated fixture formatting
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- tool/generated_runtime_fixture; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/generated_runtime_fixture
          git commit -m "style: format generated runtime fixture"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Analyze generated package fixture
        working-directory: tool/generated_runtime_fixture
        run: flutter analyze

      - name: Test generated-package-only imports
        working-directory: tool/generated_runtime_fixture
        run: flutter test

      - name: Validate package publication
        run: flutter pub publish --dry-run
