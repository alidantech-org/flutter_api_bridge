name: Flutter package CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify root formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze package
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      - name: Resolve generated package fixture
        working-directory: tool/generated_runtime_fixture
        run: flutter pub get

      - name: Verify generated fixture formatting
        working-directory: tool/generated_runtime_fixture
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze generated package fixture
        shell: bash
        working-directory: tool/generated_runtime_fixture
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/generated-fixture-analyze.log

      - name: Upload generated fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-fixture-analyze-${{ github.run_id }}
          path: /tmp/generated-fixture-analyze.log

      - name: Test generated-package-only imports
        working-directory: tool/generated_runtime_fixture
        run: flutter test

      - name: Validate package publication
        shell: bash
        run: |
          set -o pipefail
          flutter pub publish --dry-run 2>&1 | tee /tmp/publish-dry-run.log

      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-dry-run-${{ github.run_id }}
          path: /tmp/publish-dry-run.log
